add_newline = true

# Define the main prompt layout
format = """\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$nodejs\
$python\
$character\
"""

# Customize the character prompt (symbol after commands)
[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "

# Configure the current directory display
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
format = "[  $path]($style)"

# Configure Git branch and status
[git_branch]
symbol = " "
format = "[ on $branch]($style)"
style = "bold yellow"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "📁${count}"
modified = "📝${count}"
staged = "[++${count}](bold green)"
style = "bold yellow"
format = "[[$all_status]($style)]()"

# Show command duration if it took longer than 2 seconds
[cmd_duration]
min_time = 2000
format = "took [$duration]($style)"
style = "bold yellow"

# Show Node.js version
[nodejs]
format = "via [🜘 $version](bold green) "
detect_files = ["package.json", ".node-version"]

# Show Python version and virtual environment
[python]
symbol = "🐍 "
format = "via [${symbol}(${virtualenv}) $version](bold blue) "

# Show battery status if available
[battery]
full_symbol = "🔋"
charging_symbol = "⚡️"
discharging_symbol = "🔌"
format = "[$symbol $percentage]($style)"
style = "bold green"
disabled = false   
