##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = windowrule-3
  opacity = 1.0 0.95
  match:class = ^(brave-browser)$
}

windowrule {
  name = windowrule-4
  opacity = 0.5 0.9
  match:class = ^(kitty)$
}

windowrule {
  name = windowrule-5
  opacity = 1.0 0.95
  match:class = ^(vesktop)$
}


